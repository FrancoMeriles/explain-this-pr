<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PR_ATLAS_TITLE__</title>
<style>
  :root {
    --bg: #0d1117; --bg-raised: #161b22; --bg-hover: #1c2330;
    --border: #2d333b; --text: #e6edf3; --text-dim: #8b949e;
    --accent: #58a6ff; --accent-soft: rgba(88,166,255,.12);
  }
  [data-theme="light"] {
    --bg: #f6f8fa; --bg-raised: #ffffff; --bg-hover: #eef1f5;
    --border: #d0d7de; --text: #1f2328; --text-dim: #59636e;
    --accent: #0969da; --accent-soft: rgba(9,105,218,.08);
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); margin: 0;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 48px 24px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--text-dim); margin-bottom: 32px; }
  .sub code {
    background: var(--accent-soft); color: var(--accent);
    padding: 1px 6px; border-radius: 4px; font-size: 12px;
  }
  .pr {
    display: block; text-decoration: none; color: inherit;
    background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 20px; margin-bottom: 12px;
    transition: border-color .15s, background .15s;
  }
  .pr:hover { border-color: var(--accent); background: var(--bg-hover); }
  .pr-title { font-size: 16px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
  .pr-num { color: var(--accent); font-weight: 500; flex-shrink: 0; }
  .pr-meta { color: var(--text-dim); font-size: 12.5px; margin-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; }
  .pr-meta code {
    background: var(--accent-soft); color: var(--accent);
    padding: 1px 6px; border-radius: 4px; font-size: 11.5px;
  }
  .stat-add { color: #3fb950; } .stat-del { color: #f85149; }
  [data-theme="light"] .stat-add { color: #1a7f37; }
  [data-theme="light"] .stat-del { color: #cf222e; }
  .views { color: var(--text-dim); font-size: 12.5px; margin-top: 6px; }
  .toggle {
    position: fixed; top: 14px; right: 16px;
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 6px; cursor: pointer; font-size: 12px; padding: 4px 10px;
  }
  .toggle:hover { color: var(--text); }
</style>
</head>
<body>
<script>
  const DATA = __PR_ATLAS_LANDING__;
</script>
<button class="toggle" onclick="document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'light' ? '' : 'light'">◐ theme</button>
<div class="wrap">
  <h1>PR Atlas</h1>
  <p class="sub" id="sub"></p>
  <div id="list"></div>
</div>
<script>
(function () {
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const entries = DATA.entries || [];
  document.title = `PR Atlas — ${DATA.repo || "walkthroughs"}`;
  document.getElementById("sub").innerHTML =
    `<code>${esc(DATA.repo || "")}</code> ${entries.length} walkthrough${entries.length === 1 ? "" : "s"} — orientation aids, not reviews`;

  document.getElementById("list").innerHTML = entries.map(e => {
    const p = e.pr || {};
    const s = p.stats || {};
    const num = p.number ? `<span class="pr-num">#${esc(p.number)}</span>` : "";
    const views = (e.views || []).map(v => esc(v)).join(" · ");
    return `<a class="pr" href="${esc(e.dir)}/index.html">
      <div class="pr-title">${num}<span>${esc(p.title || e.dir)}</span></div>
      <div class="pr-meta">
        ${p.author ? `<span>by ${esc(p.author)}</span>` : ""}
        ${p.head || p.base ? `<span><code>${esc(p.head || "?")}</code> → <code>${esc(p.base || "?")}</code></span>` : ""}
        ${s.files != null ? `<span>${s.files} files</span>` : ""}
        ${s.additions != null ? `<span class="stat-add">+${s.additions}</span>` : ""}
        ${s.deletions != null ? `<span class="stat-del">−${s.deletions}</span>` : ""}
      </div>
      ${views ? `<div class="views">${views}</div>` : ""}
    </a>`;
  }).join("");
})();
</script>
</body>
</html>
